replicaCount: 1
revisionHistoryLimit: 0
deploymentStrategy:
  type: RollingUpdate

## PodDisruptionBudget
## ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/#specifying-a-poddisruptionbudget
## Only useful with replicaCount > 1 on storage every replica can mount (ReadWriteMany). With a
## ReadWriteOnce volume an evicted pod can't start on another node while the other replica still
## holds the volume, so a PDB can block node drains indefinitely.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

imagePullSecrets: []

image:
  repository: snipe/snipe-it
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

## Init container that hands the sessions directory on the volume to the user Apache runs as.
configData:
  # Set to false on storage that rejects chown (e.g. AWS EFS, some NFS servers)
  enabled: true
  # Owner Apache runs as, passed to chown. 10000:0 is the Ubuntu image's docker:root. For -alpine image
  # tags use apache:root (names resolve because the init container runs the Snipe-IT image by default).
  owner: "10000:0"
  # Defaults to the Snipe-IT image, which the node pulls for the main container anyway
  image: ""
  securityContext: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Override the name of the service account:
  name: ""
  # Annotations to add to the service account
  annotations: {}

service:
  type: ClusterIP
  annotations: {}

config:
  ## Connection to your MySQL or MariaDB database. Used when config.externalSecrets is empty.
  ## The chart does not deploy a database.
  mysql:
    externalDatabase:
      user: "snipeit"
      pass: ""
      name: db-snipeit
      host: mysql
      port: 3306

  snipeit:
    env: production
    debug: false
    url: http://example.local
    key: ""
    timezone: America/Los_Angeles
    locale: en
    envConfig: {}
  ## Name of the secret containing the database connection details
  ## kubectl create secret generic my-db-secret \
  ##   --from-literal=MYSQL_USER=<your_mysql_user> \
  ##   --from-literal=MYSQL_DATABASE=<your_mysql_database> \
  ##   --from-literal=MYSQL_PASSWORD=<your_mysql_password> \
  ##   --from-literal=MYSQL_PORT_3306_TCP_ADDR=<your_mysql_host> \
  ##   --from-literal=MYSQL_PORT_3306_TCP_PORT=<your_mysql_port> \
  ##   --from-literal=APP_KEY=<your_app_key>

  externalSecrets: ""

persistence:
  enabled: true
  annotations: {}
  accessMode: ReadWriteOnce
  existingClaim: ""
  ## database data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  # storageClass: "-"
  size: 2Gi

  www:
    mountPath: /var/lib/snipeit
    subPath: www
  sessions:
    mountPath: /var/www/html/storage/framework/sessions
    subPath: sessions

## networking.k8s.io/v1 Ingress (Kubernetes 1.19+)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  path: /
  pathType: ImplementationSpecific
  hosts:
    - example.local
  tls: []
  #  - secretName: example-local
  #    hosts:
  #      - example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

## Probes for the Snipe-IT container.
## Snipe-IT 8.8.4+ returns 400 to requests whose Host header doesn't match APP_URL, and kubelet sends
## the pod IP and port as Host. So any httpGet probe here that has no Host header of its own gets one
## with the host from config.snipeit.url.
## Your values merge with these defaults. Setting exec, tcpSocket or grpc on a probe replaces its default
## httpGet. To disable a probe, set it to null with -f or --set; a null in a parent chart's own values.yaml
## does not remove a subchart default.

## The container runs database migrations before Apache starts. The startup probe gives that up to
## 10 minutes (120 x 5s) before the liveness probe takes over. MySQL schema changes aren't transactional,
## so a migration killed halfway can leave the schema half-changed: raise failureThreshold for large
## databases or upgrades that skip many versions.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 120

## /health queries the database, so a liveness probe on it restarts Snipe-IT whenever the database
## is slow or unreachable, which a restart can't fix. Liveness instead fetches a static file that
## Apache serves without PHP or the database, so it only fails when Apache itself is stuck.
## Readiness keeps /health to take a pod out of rotation while it can't serve, and the startup probe
## keeps it so liveness only begins once Snipe-IT works.
livenessProbe:
  httpGet:
    path: /robots.txt
    port: http
  periodSeconds: 15
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 15
  timeoutSeconds: 3

nodeSelector: {}

tolerations: []

securityContext: {}
  # Security Context added to SnipeIT Pod(s)

affinity: {}

## Lifecycle hooks for the Snipe-IT container. Behind a load balancer, a short preStop delay keeps Snipe-IT
## serving while the load balancer stops sending requests to a pod that is shutting down:
#   preStop:
#     sleep:
#       seconds: 10
lifecycle: {}

## Seconds Kubernetes waits for the pod to stop before killing it (Kubernetes default: 30). It has to cover
## the preStop delay plus Snipe-IT's shutdown.
terminationGracePeriodSeconds: null

## Init containers added after the chart's config-data container. One with restartPolicy: Always runs as a
## native sidecar (Kubernetes 1.29+): it starts before Snipe-IT and stops after it, which is how to run a
## database proxy such as cloud-sql-proxy (see "Extra Containers and Sidecars" in the README).
extraInitContainers: []

## Containers added next to Snipe-IT, started and stopped together with it.
extraContainers: []

extraAnnotations: {}
  # Extra Annotations that will be added to the SnipeIT Pod(s)
  # app.kubernetes.io/instance: snipeit
extraManifests: []

extraVolumeMounts: []
  # Additional volumeMounts to the container
  # - name: secrets-store01-inline
  #   mountPath: /mnt/secrets-store

extraVolumes: []
  # Additional volumes to the pod
  # - csi:
  #   driver: secrets-store.csi.k8s.io
  #   readOnly: true
  #   volumeAttributes:
  #     secretProviderClass: "secret-csi-provider"
  #  name : secrets-store01-inline