{{- include "snipeit.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snipeit.fullname" . }}
  labels:
    {{ include "snipeit.labels" . | indent 4 | trim }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
{{- with .Values.deploymentStrategy }}
  strategy:
{{ toYaml . | trim | indent 4 }}
{{- end }}
  selector:
    matchLabels:
      {{ include "snipeit.selector" . | indent 6 | trim }}
  template:
    metadata:
      labels:
        {{ include "snipeit.selector" . | indent 8 | trim }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if not (hasKey (.Values.extraAnnotations | default dict) "kubectl.kubernetes.io/default-container") }}
        kubectl.kubernetes.io/default-container: {{ include "snipeit.fullname" . }}
        {{- end }}
    {{- if .Values.extraAnnotations }}
      {{- range $key, $value := .Values.extraAnnotations }}
        {{ $key }}: {{ $value | quote }}
      {{- end }}
    {{- end }}
    spec:
      serviceAccountName: {{ include "snipeit.serviceAccountName" . }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $configData := ne (toString .Values.configData.enabled) "false" }}
      {{- if or $configData .Values.extraInitContainers }}
      initContainers:
        {{- if $configData }}
        - name: config-data
          image: "{{ .Values.configData.image | default (include "snipeit.image" .) }}"
          {{- if not .Values.configData.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          command: ["sh", "-c", "chown -R {{ .Values.configData.owner | default "10000:0" }} {{ .Values.persistence.sessions.mountPath }}"]
          {{- with .Values.configData.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.sessions.mountPath }}
              subPath: {{ .Values.persistence.sessions.subPath }}
        {{- end }}
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
      {{- if .Values.extraContainers }}
        {{- toYaml .Values.extraContainers | nindent 8 }}
      {{- end }}
        - name: {{ include "snipeit.fullname" . }}
          image: "{{ include "snipeit.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_ENV
              value: {{ .Values.config.snipeit.env | quote }}
            - name: APP_DEBUG
              value: {{ .Values.config.snipeit.debug | quote }}
            - name: APP_URL
              value: {{ .Values.config.snipeit.url | quote }}
            - name: APP_TIMEZONE
              value: {{ .Values.config.snipeit.timezone | quote }}
            - name: APP_LOCALE
              value: {{ .Values.config.snipeit.locale | quote }}
          envFrom:
            - secretRef:
                name: {{ include "snipeit.fullname" . }}
            {{- if .Values.config.externalSecrets }}
            - secretRef:
                name: {{ .Values.config.externalSecrets }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
        {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.startupProbe }}
          startupProbe:
            {{- include "snipeit.probe" (dict "probe" . "context" $) | nindent 12 }}
        {{- end }}
        {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- include "snipeit.probe" (dict "probe" . "context" $) | nindent 12 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- include "snipeit.probe" (dict "probe" . "context" $) | nindent 12 }}
        {{- end }}
        {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
        {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.www.mountPath }}
              subPath: {{ .Values.persistence.www.subPath }}
            - name: data
              mountPath: {{ .Values.persistence.sessions.mountPath }}
              subPath: {{ .Values.persistence.sessions.subPath }}
            {{- if .Values.extraVolumeMounts }}
              {{- toYaml .Values.extraVolumeMounts | nindent 12}}
            {{- end }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{- else }}{{ include "snipeit.fullname" . }}{{- end }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- if .Values.extraVolumes }}
          {{- toYaml .Values.extraVolumes | nindent 8}}
        {{- end }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml . | indent 8 | trim }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{ toYaml . | indent 8 | trim }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{ toYaml . | indent 8 | trim }}
    {{- end }}
    {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
    {{- end }}