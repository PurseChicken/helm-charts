{{- if .Values.iam }}
{{- $allowResourceDeletion := .Values.allowResourceDeletion }}
{{- $projectName := include "cnrm-chart.projectID" . }}
{{- range .Values.iam }}
{{- $deletion := $allowResourceDeletion }}
{{- if hasKey . "allowResourceDeletion" }}
{{- $deletion = .allowResourceDeletion }}
{{- end }}
{{- if .name }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  annotations:
    {{- include "cnrm-chart.cnrmAnnotations" (dict "projectName" $projectName "allowResourceDeletion" $deletion) | nindent 4 }}
    {{- include "cnrm-chart.customAnnotations" (dict "annotations" .customAnnotations) | nindent 4 }}
  name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .name) }}
spec:
  {{- if .displayName }}
  displayName: {{ .displayName | quote }}
  {{- end }}
  {{- if .description }}
  description: {{ .description }}
  {{- end }}
  resourceID: {{ .name }}
{{- end }}
{{- if .iamPolicyMember }}
{{- range .iamPolicyMember }}
---
{{ include "cnrm-chart.iamPolicyMember" (dict "projectName" $projectName "allowResourceDeletion" $deletion "member" .) }}
{{- end }}
{{- end }}
{{- if .iamPolicy }}
{{- $saName := .name }}
{{- range .iamPolicy }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicy
metadata:
  annotations:
    {{- include "cnrm-chart.deletionPolicy" (dict "allowResourceDeletion" $deletion) | nindent 4 }}
  name: {{ $projectName }}-{{ include "cnrm-chart.sanitizeName" .name }}
spec:
  resourceRef:
    kind: {{ .kind }}
    {{- if eq .kind "IAMServiceAccount" }}
    external: projects/{{ $projectName }}/serviceAccounts/{{ $saName }}@{{ $projectName }}.iam.gserviceaccount.com
    {{- end }}
  bindings:
    {{- toYaml .bindings | nindent 4 }}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}