{{- if .Values.k8s }}
{{- $allowResourceDeletion := .Values.allowResourceDeletion }}
{{- $projectName := include "cnrm-chart.projectID" . }}
{{- $sharedVpcHostProject := include "cnrm-chart.sharedVpcHostProject" . }}
{{- range .Values.k8s }}
---
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  annotations:
    {{- include "cnrm-chart.cnrmAnnotations" (dict "projectName" $projectName "allowResourceDeletion" $allowResourceDeletion) | nindent 4 }}
    {{- include "cnrm-chart.customAnnotations" (dict "annotations" .customAnnotations) | nindent 4 }}
    cnrm.cloud.google.com/remove-default-node-pool: "true"
  name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .clusterName) }}
spec:
  resourceID: {{ .clusterName }}
  location: {{ .clusterLocation }}
  initialNodeCount: 1
  workloadIdentityConfig:
    workloadPool: {{ $projectName }}.svc.id.goog
  {{- include "cnrm-chart.validateNetworkRefs" . }}
  {{- if .sharedVpcNetwork }}
  networkRef:
    external: {{ .sharedVpcNetwork }}
  subnetworkRef:
    external: {{ .sharedVpcSubnetwork }}
  {{- else if .sharedVpc }}
  {{- $hostProj := .sharedVpc.hostProject | default $sharedVpcHostProject }}
  {{- if not $hostProj }}
  {{- fail "sharedVpc.hostProject is required (or set sharedVpc.attachToHostProject at the top level)" }}
  {{- end }}
  {{- $region := .sharedVpc.subnetworkRegion | default (include "cnrm-chart.extractRegion" .clusterLocation) }}
  networkRef:
    external: {{ include "cnrm-chart.sharedVpcNetworkPath" (dict "hostProject" $hostProj "network" .sharedVpc.network) }}
  subnetworkRef:
    external: {{ include "cnrm-chart.sharedVpcSubnetworkPath" (dict "hostProject" $hostProj "region" $region "subnetwork" .sharedVpc.subnetwork) }}
  {{- else }}
  networkRef:
    name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .networkName) }}
  subnetworkRef:
    name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .subnetName) }}
  {{- end }}
  ipAllocationPolicy:
    servicesSecondaryRangeName: {{ .servicesSecondaryRangeName }}
    clusterSecondaryRangeName: {{ .clusterSecondaryRangeName }}
  {{- if .clusterAutoscaling }}
  clusterAutoscaling:
    {{- toYaml .clusterAutoscaling | nindent 4 }}
  {{- end }}
  {{- if .releaseChannel }}
  releaseChannel:
    channel: {{ .releaseChannel }}
  {{- end }}
  {{- if .datapathProvider }}
  datapathProvider: {{ .datapathProvider }}
  {{- end }}
  enableIntranodeVisibility: {{ default false .enableIntranodeVisibility }}
  {{- if .enableShieldedNodes }}
  enableShieldedNodes: {{ .enableShieldedNodes }}
  {{- end }}
  {{- if .addonsConfig }}
  addonsConfig:
    {{- toYaml .addonsConfig | nindent 4 }}
  {{- end }}
  {{- if .verticalPodAutoscalingEnabled }}
  verticalPodAutoscaling:
    enabled: {{ .verticalPodAutoscalingEnabled }}
  {{- end }}
  {{- if .loggingConfig }}
  loggingConfig:
    {{- toYaml .loggingConfig | nindent 4 }}
  {{- end }}
  {{- if .maintenancePolicy }}
  maintenancePolicy:
    {{- toYaml .maintenancePolicy | nindent 4 }}
  {{- end }}
  {{- if .monitoringConfig }}
  monitoringConfig:
    {{- toYaml .monitoringConfig | nindent 4 }}
  {{- end }}
  {{- with .gatewayApiConfig }}
  gatewayApiConfig:
    channel: {{ .channel }}
  {{- end }}
  {{- with .binaryAuthorization }}
  binaryAuthorization:
    evaluationMode: {{ .evaluationMode }}
  {{- end }}
  {{- if .costManagementConfig }}
  costManagementConfig:
    enabled: true
  {{- end }}
{{- if .nodePool }}
{{- $clusterName := .clusterName }}
{{- range .nodePool }}
{{- $nodePoolName := .name }}
{{- $nodePoolTags := .tags }}
{{- if and .nodeConfig (hasKey .nodeConfig "preemptible") (hasKey .nodeConfig "spot") }}
{{- if and .nodeConfig.preemptible .nodeConfig.spot }}
{{- fail (printf "cnrm-chart: nodePool %q nodeConfig cannot set both preemptible and spot to true" $nodePoolName) }}
{{- end }}
{{- end }}
---
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  annotations:
    {{- include "cnrm-chart.cnrmAnnotations" (dict "projectName" $projectName "allowResourceDeletion" $allowResourceDeletion) | nindent 4 }}
    {{- include "cnrm-chart.customAnnotations" (dict "annotations" .customAnnotations) | nindent 4 }}
  name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .name) }}
spec:
  {{- if .namePrefix }}
  namePrefix: {{ .namePrefix | quote }}
  {{- else }}
  resourceID: {{ .name }}
  {{- end }}
  {{- if and .autoscaling (or .autoscaling.totalMinNodeCount .autoscaling.totalMaxNodeCount) }}
  autoscaling:
    {{- if .autoscaling.totalMinNodeCount }}
    totalMinNodeCount: {{ .autoscaling.totalMinNodeCount }}
    {{- end }}
    {{- if .autoscaling.totalMaxNodeCount }}
    totalMaxNodeCount: {{ .autoscaling.totalMaxNodeCount }}
    {{- end }}
    {{- if .autoscaling.locationPolicy }}
    locationPolicy: {{ .autoscaling.locationPolicy }}
    {{- end }}
  {{- else }}
  autoscaling:
    minNodeCount: {{ .minNodeCount }}
    maxNodeCount: {{ .maxNodeCount }}
    {{- if and .autoscaling .autoscaling.locationPolicy }}
    locationPolicy: {{ .autoscaling.locationPolicy }}
    {{- end }}
  {{- end }}
  clusterRef:
    name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" $clusterName) }}
  {{- if .initialNodeCount }}
  initialNodeCount: {{ .initialNodeCount }}
  {{- end }}
  {{- if .nodeLocation }}
  location: {{ .nodeLocation }}
  {{- end }}
  {{- with .management }}
  management:
    autoRepair: {{ .autoRepair }}
    autoUpgrade: {{ .autoUpgrade }}
  {{- end }}
  {{- if .maxPodsPerNode }}
  maxPodsPerNode: {{ .maxPodsPerNode }}
  {{- end }}
  {{- with .networkConfig }}
  networkConfig:
    {{- if hasKey . "createPodRange" }}
    createPodRange: {{ .createPodRange }}
    {{- end }}
    {{- if hasKey . "enablePrivateNodes" }}
    enablePrivateNodes: {{ .enablePrivateNodes }}
    {{- end }}
    {{- with .podCidrOverprovisionConfig }}
    podCidrOverprovisionConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .podIpv4CidrBlock }}
    podIpv4CidrBlock: {{ .podIpv4CidrBlock | quote }}
    {{- end }}
    {{- if .podRange }}
    podRange: {{ .podRange | quote }}
    {{- end }}
    {{- if .subnetworkRef }}
    subnetworkRef:
{{ include "cnrm-chart.gcpObjectRef" (dict "projectName" $projectName "ref" .subnetworkRef) | trim | indent 6 }}
    {{- else if .subnetworkRefName }}
    subnetworkRef:
      name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .subnetworkRefName) }}
    {{- end }}
    {{- with .additionalNodeNetworkConfigs }}
    {{/* Multi-NIC configs are rare; pass through raw. Use "external" (selfLink) or an already-prefixed "name" for in-chart refs. */}}
    additionalNodeNetworkConfigs:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .additionalPodNetworkConfigs }}
    additionalPodNetworkConfigs:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with .nodeConfig }}
  nodeConfig:
    {{- with .advancedMachineFeatures }}
    advancedMachineFeatures:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .bootDiskKMSCryptoKeyRef }}
    bootDiskKMSCryptoKeyRef:
{{ include "cnrm-chart.gcpObjectRef" (dict "projectName" $projectName "ref" .bootDiskKMSCryptoKeyRef) | trim | indent 6 }}
    {{- else if .bootDiskKMSCryptoKeyRefName }}
    bootDiskKMSCryptoKeyRef:
      name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .bootDiskKMSCryptoKeyRefName) }}
    {{- end }}
    {{- with .confidentialNodes }}
    confidentialNodes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .diskSizeGb }}
    diskSizeGb: {{ .diskSizeGb }}
    {{- end }}
    {{- if .diskType }}
    diskType: {{ .diskType }}
    {{- end }}
    {{- with .ephemeralStorageConfig }}
    ephemeralStorageConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .ephemeralStorageLocalSsdConfig }}
    ephemeralStorageLocalSsdConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .fastSocket }}
    fastSocket:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .gcfsConfig }}
    gcfsConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .guestAccelerator }}
    guestAccelerator:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .gvnic }}
    gvnic:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .hostMaintenancePolicy }}
    hostMaintenancePolicy:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .imageType }}
    imageType: {{ .imageType }}
    {{- end }}
    {{- with .kubeletConfig }}
    kubeletConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .linuxNodeConfig }}
    linuxNodeConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .localNvmeSsdBlockConfig }}
    localNvmeSsdBlockConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .localSsdCount }}
    localSsdCount: {{ .localSsdCount }}
    {{- end }}
    {{- if .loggingVariant }}
    loggingVariant: {{ .loggingVariant }}
    {{- end }}
    {{- if .machineType }}
    machineType: {{ .machineType }}
    {{- end }}
    {{- if .metadata }}
    metadata:
      {{- toYaml .metadata | nindent 6 }}
    {{- end }}
    {{- if .minCpuPlatform }}
    minCpuPlatform: {{ .minCpuPlatform | quote }}
    {{- end }}
    {{- if .nodeGroupRef }}
    nodeGroupRef:
{{ include "cnrm-chart.gcpObjectRef" (dict "projectName" $projectName "ref" .nodeGroupRef) | trim | indent 6 }}
    {{- else if .nodeGroupRefName }}
    nodeGroupRef:
      name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .nodeGroupRefName) }}
    {{- end }}
    {{- if .oauthScopes }}
    oauthScopes:
      {{- toYaml .oauthScopes | nindent 6 }}
    {{- end }}
    {{- if hasKey . "preemptible" }}
    preemptible: {{ .preemptible }}
    {{- end }}
    {{- with .reservationAffinity }}
    reservationAffinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .resourceLabels }}
    resourceLabels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .sandboxConfig }}
    sandboxConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .serviceAccountRef }}
    serviceAccountRef:
{{ include "cnrm-chart.gcpObjectRef" (dict "projectName" $projectName "ref" .serviceAccountRef) | trim | indent 6 }}
    {{- else if .serviceAccountRefName }}
    serviceAccountRef:
      name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .serviceAccountRefName) }}
    {{- end }}
    {{- with .shieldedInstanceConfig }}
    shieldedInstanceConfig:
      enableSecureBoot: {{ .enableSecureBoot }}
      enableIntegrityMonitoring: {{ .enableIntegrityMonitoring }}
    {{- end }}
    {{- with .soleTenantConfig }}
    soleTenantConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if hasKey . "spot" }}
    spot: {{ .spot }}
    {{- end }}
    tags:
      - "{{ $nodePoolName }}-nodes"
    {{- if $nodePoolTags }}
      {{- toYaml $nodePoolTags | nindent 6 }}
    {{- end }}
    {{- with .taint }}
    taint:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .windowsNodeConfig }}
    windowsNodeConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .workloadMetadataConfig }}
    workloadMetadataConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with .nodeLocations }}
  nodeLocations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .placementPolicy }}
  placementPolicy:
    {{- if .type }}
    type: {{ .type }}
    {{- end }}
    {{- if .tpuTopology }}
    tpuTopology: {{ .tpuTopology | quote }}
    {{- end }}
    {{- if .policyNameRef }}
    policyNameRef:
{{ include "cnrm-chart.gcpObjectRef" (dict "projectName" $projectName "ref" .policyNameRef) | trim | indent 6 }}
    {{- else if .policyNameRefName }}
    policyNameRef:
      name: {{ include "cnrm-chart.resourceName" (dict "projectName" $projectName "name" .policyNameRefName) }}
    {{- end }}
  {{- end }}
  {{- if .upgradeSettings }}
  upgradeSettings:
    {{- toYaml .upgradeSettings | nindent 4 }}
  {{- end }}
  {{- if .version }}
  version: {{ .version | quote }}
  {{- end }}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}